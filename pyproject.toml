[project]
name = "kinexar"
version = "0.1.0"
description = "Kinematic Expert Factorization for Multimodal Trajectory Forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Aryan", email = "aryanipb@github.com" }
]
keywords = [
  "trajectory-forecasting",
  "autonomous-driving",
  "motion-prediction",
  "argoverse",
  "cvae",
  "deep-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "torch>=2.4",
  "pyarrow>=18,<20",
  "scipy>=1.14,<1.17",
  "pillow>=10,<13",
]

[project.optional-dependencies]
cloud = ["modal>=0.63.0"]
lint = ["pyflakes>=3.4.0,<4"]
dev = ["kinexar[cloud,lint]"]

[project.urls]
Homepage = "https://github.com/aryanipb/kinexar"
Repository = "https://github.com/aryanipb/kinexar"
Issues = "https://github.com/aryanipb/kinexar/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kinexar*"]

[tool.pyflakes]
max_line_length = 120
